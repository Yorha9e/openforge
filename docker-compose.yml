version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openforge_dev}
      POSTGRES_DB: openforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auxiliary upstream for toxiproxy chaos tests.  toxiproxy listens on
  # toxiproxy:5432 and forwards to this postgres instance.  Tests reach the
  # cluster through the admin API (port 8474) and the proxy port.
  postgres-proxied:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openforge_dev}
      POSTGRES_DB: openforge
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"
    networks:
      - default

  nodejs-io:
    build: ./nodejs-io
    ports:
      - "50051:50051"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy

  openforge:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_ROUTER_ADDR: nodejs-io:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-32b!}
    command: ["-config", "config/profiles/docker-dev.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      nodejs-io:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: of-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - openforge

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: of-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deployments/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - am-data:/alertmanager
    environment:
      OF_FEISHU_WEBHOOK_URL: ${OF_FEISHU_WEBHOOK_URL:-http://example.invalid/webhook}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    depends_on:
      - prometheus

volumes:
  pgdata:
  prom-data:
  am-data:
