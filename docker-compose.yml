version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openforge_dev}
      POSTGRES_DB: openforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auxiliary upstream for toxiproxy chaos tests.  toxiproxy listens on
  # toxiproxy:5432 and forwards to this postgres instance.  Tests reach the
  # cluster through the admin API (port 8474) and the proxy port.
  postgres-proxied:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openforge_dev}
      POSTGRES_DB: openforge
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"
    networks:
      - default

  nodejs-io:
    build: ./nodejs-io
    ports:
      - "50051:50051"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy

  openforge:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_ROUTER_ADDR: nodejs-io:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-32b!}
    command: ["-config", "config/profiles/docker-dev.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      nodejs-io:
        condition: service_started

volumes:
  pgdata:
