# OpenForge Prometheus Configuration
# Scrapes the Go server's /metrics endpoint and loads alert rules.
# Alerts are forwarded to Alertmanager which dispatches to Feishu webhooks.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: openforge
    env: production

# Alertmanager endpoint
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/rules/of_alerts.yml

# Scrape targets
scrape_configs:
  - job_name: openforge
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - openforge:8080
        labels:
          service: openforge-server
          component: backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          component: observability

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: alertmanager
          component: observability
